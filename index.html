<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توصيلة سوهاج 🚕</title>
<meta name="description" content="تطبيق توصيل أفراد في سوهاج - جرجا - طهطا - البلينا">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#059669">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="توصيلة سوهاج">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
  body{margin:0;background:#f1f5f9;color:#0f172a}
  #loading{text-align:center;padding:60px 20px;font-size:18px;font-weight:bold;color:#059669;line-height:1.8}
  #loading span{font-size:13px;color:#666;font-weight:normal}
  .spinner{width:40px;height:40px;border:4px solid #d1fae5;border-top:4px solid #059669;border-radius:50%;margin:14px auto;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ده المكان اللي app.js هيرسم فيه التطبيق كله - متغيرش الـ id -->
<div id="tawsila-app">
  <div id="loading">
    🚕 توصيلة سوهاج
    <div class="spinner"></div>
    <span>جارى تحميل توصيلة سوهاج...<br>لو فضلت كده 10 ثواني - امسح الكاش وافتح تاني</span>
  </div>
</div>

<!-- Firebase - لازم دول قبل app.js - بنفس الترتيب -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ملف التطبيق الرئيسي - فيه الفايربيس بتاعك -->
<script src="app.js"></script>

<script>
// لو التطبيق فضل واقف 10 ثواني - وري رسالة الخطأ
setTimeout(()=>{
  const el = document.getElementById('loading');
  if(el){
    el.innerHTML = 'التطبيق مش راضي يفتح 😓<br><span style="color:#dc2626">السبب غالباً واحد من دول:<br>1- ملف app.js مش موجود او فيه خطأ<br>2- النت ضعيف<br>3- الكاش القديم معلق</span><br><br><button onclick="location.href=location.href.split(\'?\')[0]+\'?v=\'+Date.now()" style="padding:12px 22px;background:#059669;color:#fff;border:none;border-radius:10px;font-weight:bold">🔄 حاول تاني</button>';
  }
}, 10000);
</script>

</body>
</html>
